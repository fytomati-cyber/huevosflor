<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Almacén Huevos FLOR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(#aee1f9, #fef6e4);
      margin: 0;
      padding: 0;
    }

    header {
      background: url("Portada.png");
      text-align: center;
      padding: 40px 20px;
      color: #fff;
      font-size: 2.5em;
      font-weight: bold;
      text-shadow: 2px 2px 4px #5a3e1b;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
      background-color: #fff8e1;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      padding: 20px 40px;
    }

    h2 {
      color: #5a3e1b;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #5a3e1b;
    }

    select, input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 2px solid #d4a373;
      border-radius: 6px;
      background-color: #fff;
    }

    button {
      display: block;
      margin: 20px auto;
      background-color: #f4a261;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #e76f51;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #d4a373;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #fef6e4;
      color: #5a3e1b;
    }

    tfoot td {
      font-weight: bold;
      color: #5a3e1b;
    }
  </style>
</head>
<body>
  <header>🥚🥚🥚 HUEVOS FLOR 🥚🥚🥚</header>

  <main>
    <!-- Menú de configuración -->
    <section id="configuracion">
      <h2>Configuración de Precios</h2>
      <form id="configMenu">
        <label>Precio Chico:
          <input type="number" id="precioChico" value="3500">
        </label>
        <label>Precio Mediano:
          <input type="number" id="precioMediano" value="4500">
        </label>
        <label>Precio Grande:
          <input type="number" id="precioGrande" value="5500">
        </label>
        <label>Precio Jumbo:
          <input type="number" id="precioJumbo" value="6500">
        </label>
        <button type="submit">Guardar Configuración</button>
      </form>
    </section>

    <!-- Registro de ventas -->
    <section>
      <h2>Registro de Ventas</h2>
      <form id="ventaForm">
        <fieldset class="grupo-tamano">
          <legend>Selecciona el tamaño:</legend>
          <label><input type="radio" name="tamano" value="Chico" required> Chico</label>
          <label><input type="radio" name="tamano" value="Mediano"> Mediano</label>
          <label><input type="radio" name="tamano" value="Grande"> Grande</label>
          <label><input type="radio" name="tamano" value="Jumbo"> Jumbo</label>
        </fieldset>

        <div class="grupo-cantidad">
          <label for="cantidad">Cantidad de cartones:</label>
          <input type="number" id="cantidad" min="1" required>
        </div>

        <button type="submit">Registrar venta</button>
      </form>
    </section>

    <!-- Filtros -->
    <section>
      <h2>Filtrar Ventas</h2>
      <select id="filtroTamano">
        <option value="todos">Mostrar todas</option>
        <option value="chico">Chico</option>
        <option value="mediano">Mediano</option>
        <option value="grande">Grande</option>
        <option value="jumbo">Jumbo</option>
      </select>
    </section>

    <!-- Tabla de ventas -->
    <table id="tablaVentas">
      <thead>
        <tr>
          <th>Tamaño</th>
          <th>Cartones Vendidos</th>
          <th>Subtotal</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <td>Total de Cartones:</td>
          <td id="total">0</td>
          <td>Total en Ventas:</td>
          <td id="totalVentas">$0</td>
        </tr>
      </tfoot>
    </table>
  </main>

  <script src="Huevo.js"></script>
</body>
</html>
